{% load static %}

<div id="address-section" class="address-collapsible">
    <div class="input-row"> 
        <div class="input-group">
            <input type="text" 
                name="zip_code" 
                placeholder="CEP" 
                class="form-input"
                data-mask="cep"
                maxlength="9">
            <span class="error-message" id="error-zip_code"></span>
        </div>
    
        <input type="text" name="number" placeholder="Número" class="form-input">
    </div>
    
    <input type="text" name="street" placeholder="Rua" class="form-input">
    <input type="text" name="neighborhood" placeholder="Bairro" class="form-input">
    <input type="text" name="city" placeholder="Cidade" class="form-input">

    <div class="input-row">
        <select name="state" class="form-input">
            <option value="" disabled selected>Estado</option>
            {% for value, label in states %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>

        <select name="country" class="form-input">
            <option value="" disabled selected>País</option>
            {% for value, label in countries %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <input type="text" name="complement" placeholder="Complemento" class="form-input">
</div>

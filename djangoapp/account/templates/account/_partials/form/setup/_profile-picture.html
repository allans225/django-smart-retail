<form id="profile-picture-form" method="POST" data-url="{% url 'account:dashboard_update_picture' %}" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-section">
        <h3>Carregar Imagem</h3>
        <div class="input-group">
            <input 
                type="file" 
                name="profile_picture" 
                accept="image/jpeg, image/png, image/webp, .jfif, .pjpeg, .pjp"
                class="form-input"
            >
            <span class="error-message" id="error-picture"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-save">Salvar</button>
            {% if request.user.profile.picture %}
            <button type="button" class="btn-remove" id="btn-remove-picture" data-url="{% url 'account:delete_profile_picture' %}">
                Remover Imagem
            </button>
            {% endif %}
        </div>
    </div>
</form>
